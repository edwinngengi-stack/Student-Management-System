<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Management System</title>
  <meta name="description" content="Add, view, update and delete student records." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4fd8'/%3E%3Cpath d='M8 12l8-4 8 4-8 4z M11 15v5c0 2 10 2 10 0v-5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <h1>Student Management System</h1>
      <p>Keep all student records in one place.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" aria-label="Summary">
      <div class="stat">
        <strong id="stat-total">0</strong>
        <span>Students</span>
      </div>
      <div class="stat">
        <strong id="stat-courses">0</strong>
        <span>Courses</span>
      </div>
      <div class="stat">
        <strong id="stat-showing">0</strong>
        <span>Showing</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="search">
        <label for="search" class="sr-only">Search students</label>
        <input id="search" type="search" placeholder="Search by name, email or course" autocomplete="off" />
      </div>
      <button type="button" id="add-btn" class="btn primary">Add student</button>
    </section>

    <section class="table-card" aria-live="polite">
      <table>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Phone</th>
            <th scope="col">Course</th>
            <th scope="col">Year</th>
            <th scope="col"><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="students-body"></tbody>
      </table>
      <p id="empty" class="empty" hidden></p>
    </section>
  </main>

  <!-- Add / edit form -->
  <dialog id="student-dialog" aria-labelledby="dialog-title">
    <form id="student-form" novalidate>
      <h2 id="dialog-title">Add student</h2>

      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="off" maxlength="100" />
        <p class="error" id="name-error"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="off" maxlength="120" />
        <p class="error" id="email-error"></p>
      </div>

      <div class="field">
        <label for="phone">Phone <span class="optional">(optional)</span></label>
        <input id="phone" name="phone" type="tel" autocomplete="off" maxlength="20" />
        <p class="error" id="phone-error"></p>
      </div>

      <div class="row">
        <div class="field">
          <label for="course">Course</label>
          <input id="course" name="course" type="text" autocomplete="off" maxlength="100" />
          <p class="error" id="course-error"></p>
        </div>
        <div class="field">
          <label for="year">Year of study</label>
          <select id="year" name="year">
            <option value="1">Year 1</option>
            <option value="2">Year 2</option>
            <option value="3">Year 3</option>
            <option value="4">Year 4</option>
            <option value="5">Year 5</option>
            <option value="6">Year 6</option>
          </select>
          <p class="error" id="year-error"></p>
        </div>
      </div>

      <p class="error form-error" id="form-error"></p>

      <div class="actions">
        <button type="button" class="btn" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn primary" id="save-btn">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Delete confirmation -->
  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <h2 id="delete-title">Delete student?</h2>
    <p id="delete-text"></p>
    <div class="actions">
      <button type="button" class="btn" id="delete-cancel">Keep</button>
      <button type="button" class="btn danger" id="delete-confirm">Delete</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
